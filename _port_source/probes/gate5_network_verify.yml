---
# Gate 5 -- verify the network translation plan against a real VergeOS.
#
# Everything the mapper emits is a claim about what the server accepts.
# This proves or disproves those claims on a live system using throwaway
# objects, then removes them. It creates:
#
#   vnet  netmap-gate5-tmp   (internal, VLAN-tagged, DHCP, no uplink)
#   VM    netmap-gate5-vm    (no drives; exists only to hold a NIC)
#
# Both are deleted in the always: block, including on failure. The vnet is
# internal and attached to no physical interface, so it cannot reach any
# existing network while it exists.
#
#   ansible-playbook probes/gate5_network_verify.yml
- name: Gate 5 -- network translation against a live VergeOS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Run the modules under the interpreter that holds pyvergeos rather
    # than a discovered system python.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    # The collection declares no module_defaults action group, so
    # credentials are shared with a YAML anchor instead.
    vg: &vg
      host: "{{ lookup('env', 'VERGEOS_HOST') }}"
      username: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
      password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
    probe_vnet: netmap-gate5-tmp
    probe_vm: netmap-gate5-vm
    probe_mac: "AA:BB:CC:00:5E:01"
    probe_vlan: 3501   # must match the literal segment ids staged below
  tasks:
    - name: Require credentials
      ansible.builtin.assert:
        that: lookup('env', 'VERGEOS_PASSWORD') | length > 0
        fail_msg: >-
          Source your VergeOS env first
          (VERGEOS_HOST / VERGEOS_USERNAME / VERGEOS_PASSWORD).

    - name: Read existing vnets
      vergeio.vergeos.network_info:
        <<: *vg
      register: vnets

    # The 'alias', 'vlan' and 'name' resolvers all index this structure.
    # If its shape drifts they stop matching SILENTLY and every NIC falls
    # through to synthesis, creating duplicates of networks that exist.
    - name: Confirm network_info returns a shape index_inventory() can consume
      ansible.builtin.assert:
        that:
          - vnets.networks is defined
          - vnets.networks | length > 0
          - vnets.networks | map(attribute='name') | select | list | length > 0
        fail_msg: "network_info shape changed: {{ vnets.networks | default(omit) }}"

    - name: Make a scratch dir for the planner's inputs
      ansible.builtin.tempfile:
        state: directory
        suffix: netmap
      register: scratch

    - name: Run the whole pipeline and verify it on the lab
      block:
        - name: Stage planner inputs
          ansible.builtin.copy:
            dest: "{{ scratch.path }}/{{ item.name }}"
            content: "{{ item.body | to_nice_json }}"
            mode: "0600"
          loop:
            # Literal rather than templated: a Jinja expression used as a
            # YAML mapping KEY is not reliably rendered, and a segment id
            # that silently fails to match makes every resolver abstain --
            # which looks exactly like a correct refusal.
            - name: vms.json
              body:
                web01:
                  - key: net0
                    mac: "{{ probe_mac }}"
                    model: virtio
                    bridge: vmbr0
                    tag: 3501
                    trunks: []
                    segment: vmbr0.3501
                    connected: true
            - name: segments.json
              body:
                vmbr0.3501:
                  segment: vmbr0.3501
                  bridge: vmbr0
                  tag: 3501
                  cidr: 10.0.20.0/24
                  gateway: 10.0.20.1
                  dhcp:
                    start: 10.0.20.100
                    end: 10.0.20.200
                  source: sdn
                  confidence: authoritative
            - name: inventory.json
              body: "{{ vnets.networks }}"
            - name: policy.json
              body:
                order: [explicit, alias, vlan, name, synthesize]
          loop_control:
            label: "{{ item.name }}"

        # Planned against the REAL inventory: if the lab already held a
        # vnet on this VLAN the plan would map instead of create, and the
        # assertion below would catch it rather than silently pass.
        - name: Plan with the real netmap tool against the real inventory
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/../tools/netmap.py"
              - --vms
              - "{{ scratch.path }}/vms.json"
              - --segments
              - "{{ scratch.path }}/segments.json"
              - --inventory
              - "{{ scratch.path }}/inventory.json"
              - --policy
              - "{{ scratch.path }}/policy.json"
              - --strict
          register: planned
          changed_when: false

        - name: Adopt the plan
          ansible.builtin.set_fact:
            plan: "{{ planned.stdout | from_json }}"

        - name: The plan is clean and wants exactly one vnet built
          ansible.builtin.assert:
            that:
              - plan.ok
              - plan.creates | length == 1
              - plan.creates[0].name == 'vmbr0.' ~ probe_vlan

        - name: Rename the synthesised vnet to the throwaway probe name
          ansible.builtin.set_fact:
            spec: "{{ plan.creates[0] | combine({'name': probe_vnet}) }}"

        - name: Stage the guard inputs
          ansible.builtin.copy:
            dest: "{{ scratch.path }}/{{ item.name }}"
            content: "{{ item.body | to_nice_json }}"
            mode: "0600"
          loop:
            - name: plan.json
              body: "{{ plan }}"
            - name: states.json
              body: {web01: running}
          loop_control:
            label: "{{ item.name }}"

        - name: Guard a live attach while the source is still running
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/../tools/netguard.py"
              - --plan
              - "{{ scratch.path }}/plan.json"
              - --source-states
              - "{{ scratch.path }}/states.json"
              - --attach-mode
              - live
              - --strict
          register: guard_running
          changed_when: false
          failed_when: false

        - name: The guard refuses a live attach over a running source
          ansible.builtin.assert:
            that: guard_running.rc == 3
            fail_msg: >-
              netguard approved attaching a preserved MAC to a production
              vnet while the source VM is still up. That is the duplicate
              MAC/IP outage this gate exists to prevent.

        # --------------------------------------------- create the vnet
        - name: Create the synthesised vnet, verbatim from the plan
          vergeio.vergeos.network:
            <<: *vg
            name: "{{ spec.name }}"
            state: present
            network_type: "{{ spec.network_type }}"
            layer2_type: "{{ spec.layer2_type | default(omit) }}"
            vlan_id: "{{ spec.vlan_id | default(omit) }}"
            network: "{{ spec.network | default(omit) }}"
            ip_address: "{{ spec.ip_address | default(omit) }}"
            gateway: "{{ spec.gateway | default(omit) }}"
            dhcp_enabled: "{{ spec.dhcp_enabled | default(omit) }}"
            dhcp_start: "{{ spec.dhcp_start | default(omit) }}"
            dhcp_end: "{{ spec.dhcp_end | default(omit) }}"

        - name: Re-apply the identical spec
          vergeio.vergeos.network:
            <<: *vg
            name: "{{ spec.name }}"
            state: present
            network_type: "{{ spec.network_type }}"
            layer2_type: "{{ spec.layer2_type | default(omit) }}"
            vlan_id: "{{ spec.vlan_id | default(omit) }}"
            network: "{{ spec.network | default(omit) }}"
            ip_address: "{{ spec.ip_address | default(omit) }}"
            gateway: "{{ spec.gateway | default(omit) }}"
            dhcp_enabled: "{{ spec.dhcp_enabled | default(omit) }}"
            dhcp_start: "{{ spec.dhcp_start | default(omit) }}"
            dhcp_end: "{{ spec.dhcp_end | default(omit) }}"
          register: reapplied

        - name: Creating the same vnet twice must not report a change
          ansible.builtin.assert:
            that: not reapplied.changed
            fail_msg: >-
              The vnet is not idempotent, so every replication cycle would
              churn production networks.

        # Read back from the API rather than trusting the module's own
        # return value -- the module is the thing under test.
        # The filter value must be QUOTED. Measured across a character
        # sweep: unquoted values survive only [A-Za-z0-9.] -- a hyphen,
        # an underscore or a space all return 422 "Invalid argument".
        # `name eq External` works; `name eq netmap-gate5-tmp` does not.
        # Quoting fixes every case, so quote unconditionally. (`contains`
        # is not a valid operator at all, quoted or not.)
        - name: Read the vnet straight from the API
          ansible.builtin.uri:
            url: "https://{{ lookup('env', 'VERGEOS_HOST') }}/api/v4/vnets?fields=all&filter=name%20eq%20%27{{ probe_vnet }}%27"
            user: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
            password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
            force_basic_auth: true
            validate_certs: false
          register: row

        - name: The VLAN landed as layer2 and DHCP kept its upper bound
          ansible.builtin.assert:
            that:
              - row.json | length == 1
              - row.json[0].layer2_type == 'vlan'
              - row.json[0].layer2_id | int == probe_vlan | int
              - row.json[0].network == '10.0.20.0/24'
              - row.json[0].ipaddress == '10.0.20.1'
              - row.json[0].dhcp_enabled
              - row.json[0].dhcp_stop == '10.0.20.200'
            fail_msg: "server stored something else: {{ row.json | default([]) }}"

        # ----------------------------------------------- attach a NIC
        - name: Create a throwaway VM to hold a NIC
          vergeio.vergeos.vm:
            <<: *vg
            name: "{{ probe_vm }}"
            cpu_cores: 1
            ram: 512
            state: present

        - name: Attach a NIC with a preserved MAC
          vergeio.vergeos.nic:
            <<: *vg
            vm_name: "{{ probe_vm }}"
            network: "{{ probe_vnet }}"
            mac_address: "{{ probe_mac }}"
            nic_type: virtio
            state: present

        - name: Re-attach the identical NIC
          vergeio.vergeos.nic:
            <<: *vg
            vm_name: "{{ probe_vm }}"
            network: "{{ probe_vnet }}"
            mac_address: "{{ probe_mac }}"
            nic_type: virtio
            state: present
          register: reattached

        # Read back over the API rather than with vm_nic_info: that module
        # exists only in the maintainers' working tree, not in the released
        # collection this project installs from requirements.yml. A probe
        # that needs an unreleased module cannot verify anybody's estate.
        # (It also takes `vm` where the nic module takes `vm_name`.)
        - name: Find the VM's machine key
          ansible.builtin.uri:
            url: "https://{{ lookup('env', 'VERGEOS_HOST') }}/api/v4/vms?fields=machine&filter=name%20eq%20%27{{ probe_vm }}%27"
            user: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
            password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
            force_basic_auth: true
            validate_certs: false
          register: vm_row

        - name: Read the VM's NICs back
          ansible.builtin.uri:
            url: "https://{{ lookup('env', 'VERGEOS_HOST') }}/api/v4/machine_nics?fields=all&filter=machine%20eq%20{{ vm_row.json[0].machine }}"
            user: "{{ lookup('env', 'VERGEOS_USERNAME') }}"
            password: "{{ lookup('env', 'VERGEOS_PASSWORD') }}"
            force_basic_auth: true
            validate_certs: false
          register: nic_rows

        - name: Show what the VM actually ended up with
          ansible.builtin.debug:
            var: nic_rows.json

        # The invariant that matters is that re-running does not pile up
        # duplicate NICs, and that the MAC survives -- migration preserves
        # MACs precisely so DHCP reservations and licence bindings keep
        # working after the move.
        - name: Re-applying a NIC does not duplicate it, and keeps the MAC
          ansible.builtin.assert:
            that:
              - nic_rows.json | length == 1
              - read_mac | upper == probe_mac
              - nic_rows.json[0].interface == 'virtio'
            fail_msg: >-
              MAC not preserved, or a second NIC was created on re-apply:
              {{ nic_rows.json | default([]) }}
          vars:
            read_mac: "{{ nic_rows.json[0].macaddress | default('') }}"

        # Separate from the assertion above, because it is a reporting
        # defect rather than a data one: the NIC is correct, but a run that
        # changed nothing still reports changed. That breaks --check
        # workflows and makes change-detection useless for drift alerts.
        - name: Note the nic module's inaccurate changed flag
          ansible.builtin.debug:
            msg: >-
              KNOWN ISSUE (vergeio.vergeos.nic): re-applying an identical
              NIC reports changed={{ reattached.changed }} although the VM
              still has exactly one NIC with the same MAC, vnet and model.
              Functionally idempotent, not idempotent in its reporting.
              (changed=false here would mean the defect has been fixed.)

      always:
        - name: Remove the throwaway VM
          vergeio.vergeos.vm:
            <<: *vg
            name: "{{ probe_vm }}"
            state: absent
          failed_when: false

        - name: Remove the throwaway vnet
          vergeio.vergeos.network:
            <<: *vg
            name: "{{ probe_vnet }}"
            state: absent
          failed_when: false

        - name: Remove the scratch dir
          ansible.builtin.file:
            path: "{{ scratch.path }}"
            state: absent
          failed_when: false
