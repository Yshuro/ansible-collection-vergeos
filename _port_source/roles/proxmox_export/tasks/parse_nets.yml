---
# Shared NIC capture for both the migration and DR paths.
#
# Runs on the CONTROLLER against the `qm config` output we already hold, so
# nothing extra has to be deployed to the Proxmox nodes. The parser is a
# pure transformation (see files/pve_net_parse.py) and is unit-tested
# offline; keeping it out of Jinja is the point -- the regex it replaces
# dropped VLAN tags and invented a bridge for unconnected NICs.
- name: "Parse NICs for VMID {{ vm.vmid }}"
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python | default('python3') }}"
      - "{{ role_path }}/files/pve_net_parse.py"
    stdin: "{{ qm_cfg.stdout }}"
  register: nic_json
  changed_when: false
  delegate_to: localhost
  become: false

- name: "Adopt parsed NICs for VMID {{ vm.vmid }}"
  ansible.builtin.set_fact:
    vm_nics: "{{ nic_json.stdout | from_json }}"

# `ovf_nets` keeps its historical name so the OVF template and the DR
# manifest keep working. Its records are now richer, and crucially `net`
# carries the SEGMENT (vmbr0.20) rather than the bare bridge, so two VLANs
# on one bridge no longer collapse into a single destination network.
- name: "Project NICs onto the manifest schema for VMID {{ vm.vmid }}"
  ansible.builtin.set_fact:
    ovf_nets: "{{ vm_nics }}"

- name: "Warn about NICs the source left unconnected (VMID {{ vm.vmid }})"
  ansible.builtin.debug:
    msg: >-
      {{ vm_name }} {{ item.key }} ({{ item.mac }}) has no bridge on the
      source and is deliberately isolated. It will NOT be attached to a
      network on the destination.
  loop: "{{ vm_nics | rejectattr('connected') | list }}"
  loop_control:
    label: "{{ item.key }}"
